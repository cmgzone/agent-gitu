name: Deploy marketing website

on:
  push:
    branches: [website]
    paths:
      - 'website/**'
      - 'package.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marketing-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build website pages
        run: node website/build.cjs
      - name: Stage public files
        run: |
          mkdir -p _site/assets
          cp website/*.html website/styles.css website/script.js website/robots.txt website/sitemap.xml website/CNAME website/.nojekyll _site/
          cp -R website/assets/fonts _site/assets/
          cp website/assets/*.jpg website/assets/agent-gitu-mark.svg website/assets/agent-gitu-icon.png _site/assets/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
