user node;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 50m;
    map $http_x_forwarded_proto $gitu_scheme {
        default http;
        https https;
    }
    server {
        listen 8080;
        server_name _;
        location = /healthz {
            proxy_pass http://127.0.0.1:8321/api/auth/status;
            proxy_set_header Host localhost:8321;
            proxy_set_header X-Forwarded-Proto http;
        }
        location / {
            # Coolify terminates TLS. Never expose 8080 directly to the internet.
            # Pass the scheme only when it is exactly HTTPS; overwrite all client values.
            proxy_set_header X-Forwarded-Proto $gitu_scheme;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://127.0.0.1:8321;
        }
    }
}
