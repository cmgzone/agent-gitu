<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
<title>Agent Gitu Dock</title>
<style>
  :root {
    --bg: rgba(24, 24, 29, 0.88);
    --border: rgba(255, 255, 255, 0.13);
    --item-bg: rgba(255, 255, 255, 0.06);
    --item-hover: rgba(255, 255, 255, 0.15);
    --ink: #f4f4f6;
    --muted: #a1a1aa;
    --accent: #ff6b57;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="light"] {
    --bg: rgba(252, 252, 253, 0.92);
    --border: rgba(20, 22, 28, 0.12);
    --item-bg: rgba(20, 22, 28, 0.05);
    --item-hover: rgba(20, 22, 28, 0.11);
    --ink: #18181b;
    --muted: #63636e;
    --shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  .dock {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 8px;
    border-radius: 26px;
    background: var(--bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    max-width: 100%;
    max-height: 100%;
  }
  body[data-edge="bottom"] .dock {
    flex-direction: row;
    padding: 8px 10px;
  }
  .dock.collapsed {
    padding: 0;
    width: 16px;
    height: 76px;
    border-radius: 10px;
    justify-content: center;
    cursor: pointer;
    gap: 0;
  }
  body[data-edge="bottom"] .dock.collapsed {
    width: 76px;
    height: 16px;
  }
  .collapse-bar {
    width: 4px;
    height: 30px;
    border-radius: 99px;
    background: var(--muted);
    opacity: 0.75;
    transition: opacity 0.15s, background 0.15s;
  }
  body[data-edge="bottom"] .collapse-bar {
    width: 30px;
    height: 4px;
  }
  .dock.collapsed:hover .collapse-bar {
    opacity: 1;
    background: var(--accent);
  }
  .slots {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    overflow: hidden;
  }
  body[data-edge="bottom"] .slots {
    flex-direction: row;
  }
  .slot {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 15px;
    border: 1.5px solid transparent;
    background: var(--item-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.16s cubic-bezier(.2,.8,.2,1), background 0.15s, border-color 0.15s;
    padding: 0;
    color: var(--ink);
  }
  .slot:hover {
    transform: scale(1.09);
    background: var(--item-hover);
  }
  .slot:active {
    transform: scale(0.95);
  }
  .slot.active {
    border-color: var(--slot-accent, var(--accent));
    background: var(--item-hover);
    box-shadow: 0 0 0 2px rgba(255, 107, 87, 0.18);
  }
  .slot img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    border-radius: 10px;
    pointer-events: none;
  }
  .slot .initials {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .slot .dot {
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    border: 2px solid #18181d;
  }
  :root[data-theme="light"] .slot .dot {
    border-color: #fcfcfd;
  }
  .divider {
    width: 24px;
    height: 1px;
    background: var(--border);
    flex-shrink: 0;
  }
  body[data-edge="bottom"] .divider {
    width: 1px;
    height: 24px;
  }
  .ctrl {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--item-bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: background 0.14s, transform 0.14s;
    padding: 0;
  }
  .ctrl:hover {
    background: var(--item-hover);
    transform: scale(1.06);
  }
  .ctrl.subtle {
    width: 30px;
    height: 22px;
    border-radius: 8px;
    font-size: 11px;
    color: var(--muted);
    border-color: transparent;
    background: transparent;
  }
  .ctrl.subtle:hover {
    color: var(--ink);
    background: var(--item-bg);
    transform: none;
  }
  svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body data-edge="right">
  <div id="dock" class="dock" role="toolbar" aria-label="Agent Gitu Dock">
    <div id="slots" class="slots"></div>
    <div class="divider"></div>
    <button id="addBtn" class="ctrl" type="button" title="Add or manage agent shortcuts (+)">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="appBtn" class="ctrl" type="button" title="Open full Agent Gitu window">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <button id="collapseBtn" class="ctrl subtle" type="button" title="Tuck dock to edge">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
<script>
(function () {
  const dockEl = document.getElementById('dock');
  const slotsEl = document.getElementById('slots');
  const addBtn = document.getElementById('addBtn');
  const appBtn = document.getElementById('appBtn');
  const collapseBtn = document.getElementById('collapseBtn');

  let state = {
    agents: [],
    pinnedAgents: [],
    prefs: { edge: 'right', collapsed: false, includeCodingShortcut: true },
    theme: 'dark',
    target: { mode: 'chat', agentId: '' },
    codingSprite: '',
  };

  function applyThemeAndEdge() {
    document.documentElement.dataset.theme = state.theme === 'light' ? 'light' : 'dark';
    const edge = (state.prefs && state.prefs.edge) || 'right';
    document.body.dataset.edge = edge;
  }

  function render() {
    applyThemeAndEdge();
    const collapsed = Boolean(state.prefs && state.prefs.collapsed);
    if (collapsed) {
      dockEl.className = 'dock collapsed';
      dockEl.innerHTML = '<div class="collapse-bar" title="Expand Agent Gitu Dock"></div>';
      dockEl.onclick = () => { void window.gituDock.setCollapsed(false); };
      return;
    }

    if (dockEl.classList.contains('collapsed')) {
      window.location.reload();
      return;
    }

    dockEl.onclick = null;
    slotsEl.innerHTML = '';

    const items = Array.isArray(state.pinnedAgents) ? state.pinnedAgents : [];
    for (const ag of items) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'slot' + (state.target?.mode === 'chat' && state.target?.agentId === ag.id ? ' active' : '');
      btn.title = ag.tagline ? `${ag.name} — ${ag.tagline}` : ag.name;
      if (ag.avatar && ag.avatar.color) {
        btn.style.setProperty('--slot-accent', ag.avatar.color);
      }
      if (ag.avatar && ag.avatar.imageDataUrl) {
        const img = document.createElement('img');
        img.src = ag.avatar.imageDataUrl;
        img.alt = ag.name;
        btn.appendChild(img);
      } else {
        const span = document.createElement('span');
        span.className = 'initials';
        span.textContent = (ag.name || 'A').slice(0, 2).toUpperCase();
        btn.appendChild(span);
      }
      const dot = document.createElement('span');
      dot.className = 'dot';
      btn.appendChild(dot);
      btn.onclick = () => {
        void window.gituDock.openChat({ mode: 'chat', agentId: ag.id });
      };
      slotsEl.appendChild(btn);
    }

    if (!state.prefs || state.prefs.includeCodingShortcut !== false) {
      const codeBtn = document.createElement('button');
      codeBtn.type = 'button';
      codeBtn.className = 'slot' + (state.target?.mode === 'coding' ? ' active' : '');
      codeBtn.title = 'Coding Agent — quick coding chat';
      codeBtn.style.setProperty('--slot-accent', '#3fd68f');
      if (state.codingSprite) {
        const img = document.createElement('img');
        img.src = state.codingSprite;
        img.alt = 'Coding';
        codeBtn.appendChild(img);
      } else {
        codeBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
      }
      codeBtn.onclick = () => {
        void window.gituDock.openChat({ mode: 'coding', agentId: '__coding__' });
      };
      slotsEl.appendChild(codeBtn);
    }

    if (items.length === 0 && state.prefs && state.prefs.includeCodingShortcut === false) {
      const hint = document.createElement('button');
      hint.type = 'button';
      hint.className = 'slot';
      hint.title = 'Pin an agent to your dock';
      hint.innerHTML = '<span class="initials">AI</span>';
      hint.onclick = () => void window.gituDock.openChat({ mode: 'manage' });
      slotsEl.appendChild(hint);
    }
  }

  async function refresh() {
    try {
      const snap = await window.gituDock.snapshot();
      if (snap) {
        if (Array.isArray(snap.agents)) state.agents = snap.agents;
        if (Array.isArray(snap.pinnedAgents)) state.pinnedAgents = snap.pinnedAgents;
        if (snap.prefs) state.prefs = snap.prefs;
        if (snap.theme) state.theme = snap.theme;
        if (snap.codingSprite) state.codingSprite = snap.codingSprite;
      }
    } catch {}
    render();
  }

  addBtn.onclick = () => void window.gituDock.openChat({ mode: 'manage' });
  appBtn.onclick = () => void window.gituDock.openMain({});
  collapseBtn.onclick = () => void window.gituDock.setCollapsed(true);

  window.gituDock.onState((next) => {
    if (next && next.prefs) state.prefs = next.prefs;
    if (next && next.theme) state.theme = next.theme;
    if (next && next.target) state.target = next.target;
    void refresh();
  });

  void refresh();
  setInterval(() => { void refresh(); }, 15000);
})();
</script>
</body>
</html>
