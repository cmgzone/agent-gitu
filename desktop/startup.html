<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Gitu</title>
<style>
  :root { color-scheme: light dark; font-family: 'Segoe UI', system-ui, sans-serif; background: #fafaf9; color: #242422; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  .drag { position: fixed; inset: 0 0 auto; height: 40px; -webkit-app-region: drag; }
  main { text-align: center; padding: 55px 36px 35px; width: 100%; }
  .mark { width: 112px; height: 112px; position: relative; margin: 0 auto 24px; display: grid; place-items: center; }
  .mark::before { content: ''; position: absolute; inset: -9px; border-radius: 34px; border: 2px solid #159af525; border-top-color: #159af5; animation: orbit 3s linear infinite; }
  img { width: 96px; height: 96px; animation: breathe 2.4s ease-in-out infinite; }
  h1 { margin: 0; font-size: 29px; letter-spacing: -.8px; font-weight: 600; }
  p { color: #62625e; font-size: 14px; margin: 12px 0 26px; line-height: 1.6; }
  .dots { display: flex; justify-content: center; gap: 6px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: #159af5; animation: breathe 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  button { background: #6755c8; color: white; padding: 10px 22px; border: 0; border-radius: 9px; cursor: pointer; font: inherit; }
  button:focus-visible { outline: 3px solid #159af5; outline-offset: 4px; }
  [hidden] { display: none !important; }
  body.failed .mark::before, body.failed img { animation: none; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { opacity: .55; transform: translateY(2px); } 50% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-color-scheme: dark) { :root { background: #111; color: #e8e8e8; } p { color: #a3a3a3; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
<div class="drag"></div>
<main>
  <div class="mark"><img src="../assets/agent-gitu-mark.svg" alt="Agent Gitu icon"></div>
  <h1>Agent Gitu</h1>
  <p id="startupStatus" role="status" aria-live="polite">Opening your workspace…</p>
  <div class="dots" id="startupDots" aria-hidden="true"><i></i><i></i><i></i></div>
  <button id="startupRetry" hidden>Try again</button>
</main>
</body>
</html>
