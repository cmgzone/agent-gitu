<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Gitu</title>
<style>
  :root { color-scheme:light dark; font-family:'Segoe UI',system-ui,sans-serif; background:#b5d2e8; color:#242422; --startup-muted:#62625e; --startup-accent:#285eaa; --startup-on-accent:#fff; --startup-surface:radial-gradient(ellipse at 18% 70%,#cee9f8 0%,transparent 48%),radial-gradient(ellipse at 75% 15%,#b0cdea 0%,transparent 50%),linear-gradient(145deg,#86add1,#b5d2e8 58%,#adb8c4); }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--startup-surface); scrollbar-width:none; }
  body::-webkit-scrollbar { display:none; }
  .drag { position: fixed; inset: 0 0 auto; height: 40px; -webkit-app-region: drag; }
  main { text-align:center; padding:48px 24px 32px; width:min(100%,408px); }
  .mark { width:72px; height:72px; margin:0 auto 24px; display:grid; place-items:center; }
  img { width:72px; height:72px; }
  h1 { margin:0 0 8px; font-size:26px; letter-spacing:-.7px; font-weight:600; }
  p { color:var(--startup-muted); font-size:13px; margin:0; line-height:1.65; text-wrap:balance; }
  .dots { display:flex; justify-content:center; gap:6px; margin-top:24px; }
  .dots i { width:4px; height:4px; border-radius:50%; background:var(--startup-accent); animation:pulse 1.6s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay:.16s; }.dots i:nth-child(3) { animation-delay:.32s; }
  button { background:var(--startup-accent); color:var(--startup-on-accent); margin-top:24px; padding:10px 20px; border:0; border-radius:999px; cursor:pointer; font:inherit; font-size:13px; }
  button:focus-visible { outline:2px solid var(--startup-accent); outline-offset:4px; }
  [hidden] { display: none !important; }
  @keyframes pulse { 0%,80%,100% { opacity:.28; } 40% { opacity:1; } }
  @media(prefers-color-scheme:dark) { :root { background:#111; color:#e8e8e8; --startup-surface:#111; --startup-muted:#a3a3a3; --startup-accent:#5ba8ff; --startup-on-accent:#111; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
<div class="drag"></div>
<main>
  <div class="mark"><img src="../assets/agent-gitu-mark.svg" alt="Agent Gitu icon"></div>
  <h1>Agent Gitu</h1>
  <p id="startupStatus" role="status" aria-live="polite">Opening your workspace…</p>
  <div class="dots" id="startupDots" aria-hidden="true"><i></i><i></i><i></i></div>
  <button id="startupRetry" hidden>Try again</button>
</main>
</body>
</html>
